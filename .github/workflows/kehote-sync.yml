name: Kehotesuunnittelija skills sync
on:
  workflow_dispatch:
  schedule:
    - cron: '17,47 * * * *'
permissions:
  contents: write
concurrency:
  group: kehote-marketplace-sync
  cancel-in-progress: false
jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.event.repository.default_branch }}
      - name: Fetch published skills
        run: node .github/kehote-sync.mjs
      - name: Commit and push changes
        env:
          SYNC_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          if git diff --cached --quiet; then exit 0; fi
          git config user.name "Kehotesuunnittelija sync"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Update published marketplace skills"
          git push origin "HEAD:$SYNC_BRANCH"
